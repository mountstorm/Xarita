name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format (Biome)
        run: npm run lint
      - name: Type check (JSDoc + tsc)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Size budget
        run: npm run check:size
